name: build

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      xray_version:
        description: Xray-core version
        required: false
        default: v26.10.21

permissions:
  contents: write

env:
  XRAY_VERSION: ${{ inputs.xray_version || 'v26.10.21' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      release: ${{ steps.read.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Read VERSION
        id: read
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "invalid VERSION: '$version'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" > /dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            xray_asset: Xray-linux-64.zip
          - goarch: arm64
            xray_asset: Xray-linux-arm64-v8a.zip
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NAME: xclient-${{ needs.version.outputs.version }}-linux-${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Build uri2xray
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist/pkg
          go build -trimpath -ldflags "-s -w" -o dist/pkg/uri2xray .

      - name: Smoke test
        if: matrix.goarch == 'amd64'
        run: |
          ./dist/pkg/uri2xray "vless://0f508352-8783-4fa8-a84d-3ca257b76b26@example.com:443?security=tls&type=ws&path=/x&sni=example.com#test" | python3 -m json.tool > /dev/null
          ./dist/pkg/uri2xray "vmess://eyJhZGQiOiAiZXhhbXBsZS5jb20iLCAiYWlkIjogIjAiLCAiaWQiOiAiNGIzNmQ2YmEtYzQ3MS00OGIyLTllOWItMzEyZTZjMTMzYzk0IiwgIm5ldCI6ICJ0Y3AiLCAicG9ydCI6IDgwODgsICJwcyI6ICJ0ZXN0IiwgInNjeSI6ICJhdXRvIiwgInR5cGUiOiAibm9uZSIsICJ2IjogIjIifQ==" | python3 -m json.tool > /dev/null

      - name: Download Xray
        run: |
          curl -fsSL -o xray.zip "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/${{ matrix.xray_asset }}"
          unzip -q xray.zip -d dist/pkg

      - name: Package
        run: |
          cp scripts/menu.sh dist/pkg/menu.sh
          cp VERSION dist/pkg/VERSION
          chmod +x dist/pkg/xray dist/pkg/uri2xray dist/pkg/menu.sh
          mv dist/pkg "dist/${NAME}"
          tar -C dist -czf "${NAME}.tar.gz" "${NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tar.gz

  release:
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: xclient-*
          merge-multiple: true
          path: dist

      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.version.outputs.version }}
          body: Bundled Xray-core ${{ env.XRAY_VERSION }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
